<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BÀI 9 – NGỮ PHÁP - Flashcard</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; font-family:Arial,"Microsoft YaHei",sans-serif;
  background:#fdfbf7;
  display:flex; justify-content:center; color:#202124;
}
.app{width:min(860px,96vw); padding:30px 0 40px}
h1{text-align:center;margin:0 0 15px;font-size:38.4px; font-weight: bold;}
.progress{text-align:center;font-size:21.6px;color:#444;margin-bottom:20px; font-weight: bold;}
.card-wrap{perspective:1200px; cursor:pointer}
.card{
  width:100%; height:592px; position:relative; transform-style:preserve-3d;
  transition:transform .55s ease;
}
.card.flipped{transform:rotateY(180deg)}
.face{
  position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
  border-radius:24px; background:white; box-shadow:0 15px 45px rgba(0,0,0,.15);
  display:flex; flex-direction:column; padding:36px; border:3px solid #eee; overflow-y:auto;
}
.front{justify-content:flex-start; align-items:flex-start; text-align:left}
.back{transform:rotateY(180deg); text-align:left; align-items:flex-start; justify-content:flex-start; padding-top:40px;}

.hl{color: #7c2d12; font-weight: bold; background-color: #fef08a; padding: 2px 6px; border-radius: 4px; border: 1px solid #eab308;}
.hl-blue { color: #ffffff; font-weight: bold; background-color: #2563eb; padding: 2px 6px; border-radius: 4px; }
.hl-red { color: #dc2626; font-weight: bold; }

/* Pinyin mặt trước: căn giữa */
.pinyin{
  font-size:1.68em;
  color:#666666;
  margin-bottom:10px;
  font-weight:bold;
  text-align:center;
  width:100%;
}

.zh-front { font-size: 2.16em; font-weight: bold; margin-bottom: 6px; line-height: 1.3; color: #dc2626; text-align: center; width: 100%; }

/* Mặt sau */
.zh-back { color: #2563eb; font-weight: bold; font-size: 1.74em; line-height: 1.2; display: inline-block; margin-top: 8px; margin-bottom: 2px; }
.pinyin-back { color: #666666; font-weight: bold; font-size: 1.2em; display: block; margin: 2px 0; }
.vi-back { font-size: 1.2em; color: #333; display: block; margin-bottom: 10px; }

.desc-front { font-size: 1.38em; color: #333; margin: 8px 0; text-align: left; width: 100%; line-height: 1.4; }
.desc{font-size: 1.38em; color: #333; margin: 0; text-align: left; width: 100%; line-height: 1.4;}

.controls{display:flex;gap:20px;justify-content:center;margin-top:30px}
button{
  border:0;border-radius:20px;padding:20px 35px;font-size:26.4px;
  cursor:pointer;background:#e9eef7;color:#233044; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,.1);
}
button.primary{background:#2563eb;color:white}
</style>
</head>

<body>
<div class="app">
  <h1 id="title">BÀI 9 – NGỮ PHÁP</h1>
  <div class="progress" id="progress"></div>

  <div class="card-wrap" id="cardWrap" onclick="flipCard()">
    <div class="card" id="card">
      <div class="face front" id="frontFace"></div>
      <div class="face back" id="backFace"></div>
    </div>
  </div>

  <div class="controls">
    <button onclick="event.stopPropagation();prevCard()">← TRƯỚC</button>
    <button class="primary" onclick="event.stopPropagation();flipCard()">LẬT THẺ</button>
    <button onclick="event.stopPropagation();nextCard()">TIẾP →</button>
  </div>
</div>

       "</div>",

       "<span class='zh-back'>奶奶的身体不如以前了。</span><br><span class='pinyin-back'>Nǎinai de shēntǐ bùrú yǐqián le.</span><span class='vi-back'>(Sức khỏe của bà không bằng trước đây.)</span>" +
       "<span class='zh-back'>去近的地方，坐车不如骑车。</span><br><span class='pinyin-back'>Qù jìn de dìfang, zuò chē bùrú qíchē.</span><span class='vi-back'>(Đi chỗ gần, ngồi xe không bằng đi xe đạp.)</span>" +
       "<span class='zh-back'>骑车不如坐车快。</span><br><span class='pinyin-back'>Qíchē bùrú zuò chē kuài.</span><span class='vi-back'>(Đi xe đạp không bằng ngồi xe nhanh.)</span>" +
       "<span class='zh-back'>这个学期的学生不如上个学期多。</span><br><span class='pinyin-back'>Zhè gè xuéqī de xuésheng bùrú shàng gè xuéqī duō.</span><span class='vi-back'>(Học sinh học kỳ này không đông bằng học kỳ trước.)</span>" +
       "<span class='zh-back'>这篇作文不如那篇写得好。</span><br><span class='pinyin-back'>Zhè piān zuòwén bùrú nà piān xiě de hǎo.</span><span class='vi-back'>(Bài văn này không bằng bài kia viết hay.)</span>" +
       "<span class='zh-back'>今天的菜炒得不如昨天好。</span><br><span class='pinyin-back'>Jīntiān de cài chǎo de bùrú zuótiān hǎo.</span><span class='vi-back'>(Món ăn hôm nay xào không ngon bằng hôm qua.)</span>" +
       "<span class='zh-back'>飞龙唱歌不如李钟文好。</span><br><span class='pinyin-back'>Fēilóng chànggē bùrú Lǐ Zhōngwén hǎo.</span><span class='vi-back'>(Phi Long hát không hay bằng Lý Chung Văn.)</span>" +

       "<span class='zh-back'>今天没课，在宿舍睡觉不如去图书馆看书。</span><br><span class='pinyin-back'>Jīntiān méi kè, zài sùshè shuìjiào bùrú qù túshūguǎn kàn shū.</span><span class='vi-back'>(Hôm nay không có tiết, ở ký túc xá ngủ không bằng đến thư viện đọc sách.)</span>" +
       "<span class='zh-back'>以前中国人认为女孩儿不如男孩儿好，所以很多地方的人都喜欢生男孩儿。</span><br><span class='pinyin-back'>Yǐqián Zhōngguó rén rènwéi nǚháir bùrú nánháir hǎo, suǒyǐ hěn duō dìfang de rén dōu xǐhuan shēng nánháir.</span><span class='vi-back'>(Trước đây người Trung Quốc cho rằng con gái không tốt bằng con trai, nên nhiều nơi đều thích sinh con trai.)</span>" +
       "<span class='zh-back'>我觉得北海公园的风景不如颐和园的美。</span><br><span class='pinyin-back'>Wǒ juéde Běihǎi gōngyuán de fēngjǐng bùrú Yíhéyuán de měi.</span><span class='vi-back'>(Tôi thấy phong cảnh công viên Bắc Hải không đẹp bằng Di Hòa Viên.)</span>" +
       "</div>"
  }
];

let idx = 0;

function render() {
  document.getElementById('frontFace').innerHTML = cards[idx].f;
  document.getElementById('backFace').innerHTML = cards[idx].b;
  document.getElementById('progress').innerText = `Thẻ ${idx + 1} / ${cards.length}`;
}

function flipCard() {
  document.getElementById('card').classList.toggle('flipped');
}

function nextCard() {
  idx = (idx + 1) % cards.length;
  document.getElementById('card').classList.remove('flipped');
  render();
}

function prevCard() {
  idx = (idx - 1 + cards.length) % cards.length;
  document.getElementById('card').classList.remove('flipped');
  render();
}

document.addEventListener('keydown', function(event) {
  if (event.key === 'ArrowRight' || event.key === 'ArrowDown') {
    nextCard();
    event.preventDefault();
  } else if (event.key === 'ArrowLeft' || event.key === 'ArrowUp') {
    prevCard();
    event.preventDefault();
  } else if (event.key === ' ' || event.key === 'Enter') {
    flipCard();
    event.preventDefault();
  }
});

render();
</script>
</body>
</html>
